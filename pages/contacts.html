<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link rel="stylesheet" href="../style/styles.css">
</head>

<body>
    <div class="page">

        <!-- Шапка -->
        <header class="header">
            <h1 class="header__title">Контакты</h1>
            <button id="theme-toggle">
                <i class="about__text">Смена темы</i>
            </button>
        </header>

        <!-- Навигация -->
        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item">
                    <a class="nav__link" href="../index.html">Главная</a>
                </li>
                <li class="nav__item">
                    <a class="nav__link" href="news.html">Новости</a>
                </li>
                <li class="nav__item nav__item--active">
                    <a class="nav__link" href="contacts.html">Контакты</a>
                </li>
            </ul>
        </nav>

        <!-- Основной контент -->
        <main class="main">
            <section class="contacts">
                <h2 class="section__title">Контакты</h2>
                <div class="contacts__list">
                    <div class="contact-item">
                        <h3 class="contact-item__title">Мой телеграмм</h3>
                        <a href="https://t.me/karuenf">
                            <img class="product-image" src="../images/telegram.png" alt="Скетчевый рисунок" width="50">
                        </a>
                    </div>
                    <div class="contact-item">
                        <h3 class="contact-item__title">Адрес</h3>
                        <p class="contact-item__value">г. Москва, ул. 11-я Парковая, д. 36 Общежитие №5 МИРЭА</p>
                    </div>
                    <div class="contact-item__value">
                        <button class="contact-button" onclick="contactModal.showModal()">Не пишите мне</button>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p class="footer__text">&copy; 2025 Мой сайт</p>
        </footer>

        <dialog id="contactModal">
            <div class="modal-header">
                <h2>Форма обратной связи</h2>
            </div>

            <div class="modal-content">
                <form id="feedbackForm" method="dialog">
                    <div class="form-group">
                        <label for="name">Имя <span class="required">*</span></label>
                        <input type="text" id="name" name="name" required placeholder="Введите ваше имя">
                    </div>

                    <div class="form-group">
                        <label for="phone">Телефон <span class="required">*</span></label>
                        <input type="tel" id="phone" name="phone" required placeholder="+7 (XXX) XXX-XX-XX">
                    </div>

                    <div class="form-group">
                        <label for="email">Электронная почта <span class="required">*</span></label>
                        <input type="email" id="email" name="email" required placeholder="example@mail.ru">
                    </div>

                    <div class="form-group">
                        <label for="category">Что желаете приобрести? <span class="required">*</span></label>
                        <select id="category" name="category" required>
                            <option value="">Выберите из предложенного списка</option>
                            <option value="art1">Скетчевый рисунок</option>
                            <option value="art2">Чёрно-белый рисунок</option>
                            <option value="art3">Скетчевой рисунок в цифре</option>
                            <option value="art4">Полноценный рисунок</option>
                            <option value="complaint">Жалоба</option>
                            <option value="other">Другое</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Опишите заказ <span class="required">*</span></label>
                        <textarea id="message" name="message" required
                            placeholder="Опишите ваш заказ, который необходимо нарисовать..."></textarea>
                    </div>

                    <div class="modal-actions">
                        <!-- Кнопка отмены с автоматическим закрытием через form method="dialog" -->
                        <button type="submit" class="btn btn-secondary" onclick="contactModal.close()">Отмена</button>
                        <!-- Кнопка отправки с обработкой через JavaScript -->
                        <button type="button" class="btn btn-primary" onclick="submitForm()">Отправить</button>
                    </div>
                </form>
            </div>
        </dialog>

        <script>
            // Функция для отправки формы
            function submitForm() {
                const form = document.getElementById('feedbackForm');
                const formData = new FormData(form);

                // Простая валидация
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                // Собираем данные формы
                const data = {
                    name: formData.get('name'),
                    phone: formData.get('phone'),
                    email: formData.get('email'),
                    category: formData.get('category'),
                    message: formData.get('message')
                };

                // В реальном приложении здесь был бы AJAX-запрос
                console.log('Данные формы:', data);

                // Показываем уведомление об успешной отправке
                alert('Спасибо! Ваш заказ принят. В скором времени я свяжусь с вами!');

                // Закрываем модальное окно
                contactModal.close();

                // Очищаем форму
                form.reset();
            }

            // Закрытие модального окна по клику на фон
            document.getElementById('contactModal').addEventListener('click', function (event) {
                if (event.target === this) {
                    this.close();
                }
            });

            // Обработка отправки формы через Enter (предотвращаем стандартное поведение)
            document.getElementById('feedbackForm').addEventListener('keypress', function (event) {
                if (event.key === 'Enter' && event.target.type !== 'textarea') {
                    event.preventDefault();
                }
            });

            const themeToggle = document.getElementById('theme-toggle');
            const root = document.documentElement;

            // Проверяем тему при загрузке
            if (localStorage.getItem('theme') === 'dark') {
                root.setAttribute('data-theme', 'dark');
            }

            // Переключаем тему по клику
            themeToggle.onclick = () => {
                if (root.getAttribute('data-theme') === 'dark') {
                    root.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                } else {
                    root.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                }
            };
        </script>
    </div>
</body>

</html>
